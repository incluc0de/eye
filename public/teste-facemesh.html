<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Teste MediaPipe FaceMesh</title>
</head>

<body>
  <h1>Teste MediaPipe FaceMesh</h1>
  <pre id="status">Carregando...</pre>

  <script src="/mediapipe/face_mesh/face_mesh.js"></script>

  <script>
    const status = document.getElementById("status");

    async function testar() {
      try {
        status.textContent = "Criando FaceMesh...";

        const faceMesh = new FaceMesh({
          locateFile: (file) => {
            const url = `/mediapipe/face_mesh/${file}`;
            console.log("MediaPipe solicitou:", url);
            return url;
          }
        });

        status.textContent = "Configurando FaceMesh...";

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
          console.log("RESULTADO:", results);
        });

        status.textContent =
          "FaceMesh criado sem erro.\n\n" +
          "Objeto:\n" +
          Object.keys(faceMesh).join("\n");

        console.log("FaceMesh criado:", faceMesh);

      } catch (erro) {
        console.error("ERRO FACEMESH:", erro);

        status.textContent =
          "ERRO:\n\n" +
          (erro?.stack || erro);
      }
    }

    testar();
  </script>
</body>
</html>
